[project]
name = "findit"
version = "0.1.0"
description = "분실물 매칭 AI 에이전트 — 습득물 하이브리드 검색 + 지역 가점 + LLM grading"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
