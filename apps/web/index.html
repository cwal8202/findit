<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FindIt — 분실물 찾기</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --ink:#1f2430; --sub:#6b7280;
          --brand:#2563eb; --brand-d:#1d4ed8; --green:#16a34a; --amber:#d97706; --gray:#9ca3af; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  header h1 { font-size:24px; margin:8px 0 2px; }
  header p { color:var(--sub); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; color:var(--sub); font-weight:600;
       text-transform:uppercase; letter-spacing:.03em; }
  textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px;
             font:inherit; resize:vertical; min-height:74px; }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  label { color:var(--sub); font-size:13px; }
  input[type=date] { border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px;
           padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { background:var(--brand-d); }
  button.ghost { background:#eef2ff; color:var(--brand-d); }
  button:disabled { opacity:.6; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; }
  .chip { background:#eef2f7; border-radius:999px; padding:3px 10px; font-size:13px; color:#374151; }
  .chip.k { background:#e0e7ff; color:#3730a3; }
  .banner { border-radius:10px; padding:10px 14px; margin-bottom:12px; font-weight:600; }
  .banner.matched { background:#dcfce7; color:#166534; }
  .banner.open { background:#fef9c3; color:#854d0e; }
  .match { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;
           display:flex; gap:12px; }
  .grade { flex:0 0 52px; height:52px; border-radius:10px; display:flex; align-items:center;
           justify-content:center; font-weight:800; font-size:18px; color:#fff; }
  .m-body { flex:1; min-width:0; }
  .m-title { font-weight:700; }
  .m-meta { color:var(--sub); font-size:13px; margin-top:2px; }
  .m-reason { font-size:13px; margin-top:6px; color:#374151; }
  .muted { color:var(--sub); }
  .status { font-size:12px; padding:2px 9px; border-radius:999px; font-weight:700; }
  .status.matched { background:#dcfce7; color:#166534; }
  .status.open { background:#fef9c3; color:#854d0e; }
  .mine-item { border-top:1px solid var(--line); padding:12px 0; }
  .mine-item:first-child { border-top:0; }
  .spin { display:inline-block; width:15px; height:15px; border:2px solid #fff;
          border-top-color:transparent; border-radius:50%; animation:s .7s linear infinite;
          vertical-align:-2px; margin-right:6px; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔎 FindIt</h1>
    <p>잃어버린 물건을 자연어로 적으면, 습득물 공개데이터에서 찾아드려요.</p>
  </header>

  <div class="card">
    <h2>분실물 등록</h2>
    <textarea id="text" placeholder="예: 어제 2호선 지하철에서 검정색 닥스 지갑을 잃어버렸어요. 안에 신분증이랑 카드가 있었어요."></textarea>
    <input type="email" id="email" placeholder="알림 받을 이메일 (선택) — 나중에 매칭되면 여기로 보내드려요"
           style="width:100%; margin-top:10px; border:1px solid var(--line); border-radius:10px; padding:11px; font:inherit;" />
    <div class="row">
      <label>분실일(선택) <input type="date" id="lostDate" /></label>
      <button id="go" onclick="registerLost()">찾기</button>
      <span id="hint" class="muted" style="font-size:13px"></span>
    </div>
  </div>

  <div class="card" id="resultCard" hidden>
    <h2>매칭 결과</h2>
    <div id="result"></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <h2 style="margin:0">내 신고 목록</h2>
      <button class="ghost" onclick="loadMine()">새로고침</button>
    </div>
    <div id="mine" style="margin-top:12px"><span class="muted">불러오는 중…</span></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const gradeColor = (g) => g == null ? 'var(--gray)' : g >= 80 ? 'var(--green)' : g >= 50 ? 'var(--amber)' : 'var(--gray)';

function chips(items, cls="") {
  return `<div class="chips">${items.filter(Boolean).map(x=>`<span class="chip ${cls}">${esc(x)}</span>`).join("")}</div>`;
}

function matchCard(m) {
  const g = m.grade;
  return `<div class="match">
    <div class="grade" style="background:${gradeColor(g)}">${g==null?'–':g}</div>
    <div class="m-body">
      <div class="m-title">${esc(m.name)} <span class="muted">/ ${esc(m.color)}</span></div>
      <div class="m-meta">${esc(m.category)} · 보관: ${esc(m.dep_place)||'-'} · 지역: ${esc(m.region)||'-'} · 습득일: ${esc(m.found_at)||'-'}</div>
      ${m.reason ? `<div class="m-reason">💬 ${esc(m.reason)}</div>` : ''}
    </div>
  </div>`;
}

async function registerLost() {
  const text = $("text").value.trim();
  if (!text) { $("hint").textContent = "분실물 설명을 입력하세요."; return; }
  const btn = $("go"); btn.disabled = true;
  const orig = btn.textContent; btn.innerHTML = '<span class="spin"></span>찾는 중…';
  $("hint").textContent = "추출 → 지역 → 검색 → 판정 (10초쯤 걸려요)";
  try {
    const body = { text, lost_date: $("lostDate").value || null, email: $("email").value.trim() || null };
    const res = await fetch("/lost-items", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    if (!res.ok) throw new Error("서버 오류 " + res.status);
    const d = await res.json();
    const ex = d.extracted || {};
    const exChips = [ex.item, ex.brand, ex.color, ex.category && ("분류:"+ex.category), ex.place_context, ex.lost_date, ex.features];
    $("result").innerHTML =
      `<div class="banner ${d.status}">${d.status==="matched" ? "✅ 매칭된 습득물을 찾았어요!" : "🕓 지금은 딱 맞는 게 없어요. 접수해두고, 새 습득물이 들어오면 자동으로 다시 찾아 알려드려요."}</div>
       <div style="margin-bottom:8px"><b>추출</b> ${chips(exChips)}</div>
       ${d.region_set?.length ? `<div style="margin-bottom:8px"><b>검색 지역</b> ${chips(d.region_set, "k")}</div>` : ""}
       <div style="margin-bottom:8px"><b>후보 쿼리</b> ${chips(d.queries)}</div>
       <div style="margin-top:12px"><b>매칭 ${d.count}건</b></div>
       ${(d.matches||[]).slice(0,6).map(matchCard).join("") || '<span class="muted">후보 없음</span>'}`;
    $("resultCard").hidden = false;
    $("resultCard").scrollIntoView({ behavior:"smooth", block:"nearest" });
    $("hint").textContent = "";
    loadMine();
  } catch (e) {
    $("hint").textContent = "오류: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

async function loadMine() {
  try {
    const items = await (await fetch("/lost-items")).json();
    if (!items.length) { $("mine").innerHTML = '<span class="muted">아직 등록한 신고가 없어요.</span>'; return; }
    $("mine").innerHTML = items.map(it => {
      const bm = it.best_match;
      const when = (it.created_at||"").slice(0,10);
      return `<div class="mine-item">
        <div style="display:flex; justify-content:space-between; gap:10px">
          <div style="min-width:0">
            <div>${esc(it.text)}</div>
            <div class="m-meta">${when}${bm ? " · 최고 매칭: "+esc(bm.name)+" (grade "+(it.best_grade??"-")+")" : ""}</div>
          </div>
          <span class="status ${it.status}">${it.status==="matched"?"매칭됨":"찾는중"}</span>
        </div>
      </div>`;
    }).join("");
  } catch (e) {
    $("mine").innerHTML = '<span class="muted">목록을 불러오지 못했어요.</span>';
  }
}
loadMine();
</script>
</body>
</html>
